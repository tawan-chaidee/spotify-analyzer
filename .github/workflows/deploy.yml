name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check deployment configuration
        id: cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          missing=""
          test -n "$API_TOKEN" || missing="$missing CLOUDFLARE_API_TOKEN"
          test -n "$ACCOUNT_ID" || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLIENT_ID" || missing="$missing VITE_SPOTIFY_CLIENT_ID"
          test -n "$SITE_URL" || missing="$missing VITE_SITE_URL"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped; missing:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          VITE_DATA_SOURCE: live
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: npm run build

      - name: Deploy
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'spotify-analyzer' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
